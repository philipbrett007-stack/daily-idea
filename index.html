<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Idea</title>
<meta name="description" content="One well-sourced idea every morning, and a fresh one whenever you want it.">
<meta name="theme-color" content="#15142A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Daily Idea</span>
    </div>
    <div class="top-actions">
      <button id="install" class="install" type="button" hidden>Install app</button>
      <button id="refresh" class="icon-btn" type="button" aria-label="Check for new ideas">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <p id="banner" class="banner" role="status" hidden></p>

  <section id="view-today" class="view" aria-labelledby="today-h">
    <div class="intro">
      <h1 id="today-h">Good morning</h1>
      <p class="intro-date" id="today-date">&nbsp;</p>
    </div>

    <div class="stage" id="stage">
      <div id="today-cards" class="cards"></div>
    </div>
    <p id="today-hint" class="hint">Not for you? Swipe the card left or tap Refresh idea.</p>
    <div id="out-box" class="out-box" role="status" hidden></div>

    <section id="earlier" class="earlier" aria-labelledby="earlier-h" hidden>
      <h2 id="earlier-h">Earlier today</h2>
      <div id="earlier-cards" class="rows"></div>
    </section>

    <button id="another" class="fab" type="button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="another-label">Refresh idea</span>
      <small id="another-count"></small>
    </button>
  </section>

  <section id="view-stash" class="view" aria-labelledby="stash-h" hidden>
    <div class="intro">
      <h1 id="stash-h">Your stash</h1>
      <p class="intro-date" id="stash-sub">Ideas you've saved, kept on this phone.</p>
    </div>
    <div id="stash-cards" class="rows"></div>
  </section>

  <section id="view-archive" class="view" aria-labelledby="archive-h" hidden>
    <div class="intro">
      <h1 id="archive-h">Archive</h1>
      <p class="intro-date" id="archive-sub"></p>
    </div>
    <div id="archive-days" class="days"></div>
  </section>
</main>

<nav class="dock" aria-label="Sections">
  <button class="tab" type="button" data-view="today" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.5l1.9 5.2 5.6.3-4.4 3.5 1.5 5.4L12 14.8 7.4 17.9l1.5-5.4L4.5 9l5.6-.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>Today</span>
  </button>
  <button class="tab" type="button" data-view="stash">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <b id="stash-count" class="count" hidden></b>
    </span>
    <span>Stash</span>
  </button>
  <button class="tab" type="button" data-view="archive">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Archive</span>
  </button>
</nav>

<p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

<script src="app.js"></script>
</body>
</html>
